<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연결 끊김 · 학교 업무관리</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f8fafc; color: #1a1a1a;
        font-family: "Pretendard", -apple-system, "Malgun Gothic", sans-serif;
      }
      .box { text-align: center; padding: 2rem; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.05rem; margin: 1rem 0 0.4rem; }
      p { color: #64748b; font-size: 0.9rem; margin: 0 0 1.25rem; line-height: 1.6; }
      button {
        border: 0; border-radius: 10px; background: #225286; color: #fff;
        padding: 0.6rem 1.2rem; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>
        학사일정과 참여 현황은 늘 최신이어야 해서<br />
        저장해 두지 않습니다. 연결 후 다시 열어 주세요.
      </p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
